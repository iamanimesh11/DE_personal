services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml
      - D:/DE_personal/docker_personal/logging/loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - D:/DE_personal/docker_personal/logging/grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  grafana-storage:
