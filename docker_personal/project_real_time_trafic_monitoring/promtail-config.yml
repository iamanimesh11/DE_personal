server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "airflow_logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "airflow"
          component: "scheduler"
          service: "data_pipeline"
          __path__: "/opt/airflow/logs/**/*.log"  # ✅ Use container path, NOT Windows path!

    pipeline_stages:
      - match:
          selector: '{job="airflow"}'
          stages:
            - regex:
                expression: '.*logs/dag_id=(?P<dag_id>[^/]+)/run_id=(?P<run_id>[^/]+)/task_id=(?P<task_id>[^/]+)/attempt=(?P<attempt>\d+).log'
            - labels:
                dag_id:
                run_id:
                task_id:
                attempt:


