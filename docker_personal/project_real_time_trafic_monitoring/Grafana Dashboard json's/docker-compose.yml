services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml
      - ./loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - loki


  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: animesh11
      POSTGRES_DB: de_personal
    healthcheck:  # ✅ Ensure PostgreSQL is ready before Airflow starts
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
      timeout: 3s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  airflow-init:
    image: apache/airflow:latest
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:animesh11@postgres:5432/de_personal
      - AIRFLOW__CORE__LOAD_EXAMPLES=False  # ✅ Skip example DAGs for faster setup

    command: airflow db init


  airflow-webserver:
    image: apache/airflow:latest
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck: # ✅ Add healthcheck for Airflow webserver
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      retries: 5
      timeout: 10s
    environment:
      - TZ=Asia/Kolkata
      - AIRFLOW__WEBSERVER__AUTH_BACKEND=airflow.api.auth.backend.default
      - AIRFLOW_USER=${AIRFLOW_USER}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:animesh11@postgres:5432/de_personal
      - AIRFLOW__WEBSERVER__SECRET_KEY=mysecretkey
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags

    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username $AIRFLOW_USER --password $AIRFLOW_PASSWORD --firstname Animesh --lastname User --role Admin --email animesh@example.com || true &&
      airflow webserver"


    volumes:
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    



  airflow-scheduler:
    image: apache/airflow:latest
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-webserver:
          condition: service_healthy
    environment:
      - TZ=Asia/Kolkata
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:animesh11@postgres:5432/de_personal
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
    command: airflow scheduler
    volumes:
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins


volumes:
  loki_data:
  grafana_data:
  postgres_data:  
  airflow-logs:
  airflow-dags:
