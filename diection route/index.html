<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route to Coordinates</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Real-Time Location Tracking & Route to Coordinates</h2>
  <label for="coordinates">Enter Coordinates (Lat, Lon): </label>
  <input id="coordinates" type="text" placeholder="Enter Latitude, Longitude" />
  <button onclick="startTracking()">Start Tracking</button>
  <div id="status"></div>
  <div id="map"></div>


  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
